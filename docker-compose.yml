version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gharkatiffin_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: gharkatiffin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gharkatiffin_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gharkatiffin_web
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/gharkatiffin?schema=public
      - JWT_SECRET=production_super_secret_jwt_key_gharkatiffin_2026
      - REDIS_URL=redis://redis:6379
      - STORAGE_DRIVER=mock
      - MAPS_DRIVER=mock
      - PAYMENT_DRIVER=mock
      - NOTIFICATION_DRIVER=mock
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
